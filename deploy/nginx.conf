# La VR es una página estática con service worker (vite-plugin-pwa, registerType autoUpdate).
server {
  listen 8080;
  root /usr/share/nginx/html;

  # Lo que decide qué build ve el visor nunca se cachea: si el navegador guardara sw.js o index.html, el Quest seguiría
  # mostrando el build anterior (la trampa del service worker, CLAUDE.md del orquestador).
  location = /sw.js              { add_header Cache-Control "no-cache"; }
  location = /registerSW.js      { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location = /index.html         { add_header Cache-Control "no-cache"; }

  # Los archivos de assets/ llevan hash en el nombre: cambian de nombre en cada build.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Una sola página: ?espacio=…&proyecto=… los lee la app.
  location / { try_files $uri /index.html; }
}
