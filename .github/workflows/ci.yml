name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gate (type-check, lint, unit tests, build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke test (Playwright)
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # FASE 27: con los tests en verde, el push a main queda en producción. Corre en el runner del Mac Mini el
  # deploy/desplegar-aqui.sh publicado del orquestador (el mismo que usa bin/desplegar a mano). Despliega todo junto e
  # idempotente: lo que no cambió no se reconstruye. El candado del script evita dos composes a la vez entre repos.
  deploy:
    name: Desplegar en el Mac Mini
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mac-mini, grafo]
    # Un deploy colgado (2026-11-14: 35 min en `load metadata`) no retiene el runner las 6 h por defecto.
    timeout-minutes: 45
    steps:
      - name: deploy/desplegar-aqui.sh de origin/main del orquestador
        run: |
          # Sin pipefail, si `git show` falla `bash -s` lee un script vacío y el paso sale en verde sin desplegar.
          set -o pipefail
          git -C "$HOME/apps/grafo-tareas" fetch -q origin main
          git -C "$HOME/apps/grafo-tareas" show origin/main:deploy/desplegar-aqui.sh \
            | GRAFO_REPO=grafo-tareas.vr GRAFO_SHA="$GITHUB_SHA" bash -s
